# mTLS broker for the ha-small lab: requires client certificates.
listener 8883 0.0.0.0
allow_anonymous true
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server_tls.crt
keyfile /etc/mosquitto/certs/server_tls.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# Plain listener kept only for the weak-network baseline comparison.
listener 1883 0.0.0.0
allow_anonymous true

persistence false
log_type error
log_type notice