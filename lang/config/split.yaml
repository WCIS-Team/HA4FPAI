# lang/config/split.yaml —— 分词器档（链路③第一环：LLM 长句切短，压 TTS 峰值 RSS）
#
# 三档实现在 `lang/split/`（2026-11-04 她定：原来的 punct/window 也搬进那个目录，做成可切换）：
#   tts_split  标点优先＋**严格字数上限**（默认 20 字，超了就强制切开，不丢字）——现行默认档
#   punct      原来的标点档：句末必切、逗号只在攒够 max_chars 才切（块长不超，但断点不看语义）
#   window     固定字数硬切：不认标点，压峰值最狠、语流最差
# 换档改 `server.yaml` 的 `chain.tokenizer`；本文件的 `tokenizer_profiles.<档名>` 只是参数。
# 档位注册表在 `server/backends/__init__.py` 的 "tokenizer"。
#
# ── max_chars = 20 是怎么来的（实测，不是拍的）─────────────────────────────────
# 现役 TTS 是 `edge`（板上 `/health` 实读：tokenizer=punct、tts=edge）。本机 py3.13 用
# edge-tts 7.3.1 直接量它的单段上限（探针在 `workenv/tts-limit-probe/`）：
#   字数   音频字节     音频时长   墙钟
#     20     28,512 B     4.8 s    1.2–2.3 s
#    200    260,928 B    43.5 s    3.2 s
#    800  1,018,656 B   169.8 s    9.3 s
#   1400  1,784,304 B   297.4 s   20.4 s
#   2800  3,565,584 B   594.3 s   22.5 s      ← 完整念完
#   3000  3,600,000 B   600.0 s   26.9 s      ← **刚好顶到 600 s，尾巴被静默丢掉**
#   3200/6400 同样 3,600,000 B（同样静默丢字，不报错）
#   ⇒ 单块（一次合成调用）**音频上限 600 s ≈ 2,827 汉字**；本仓实测 **每字 ≈ 0.21 s 音频**。
#   20 字 ≈ 4.2 s 音频 = 上限的 0.7%，离丢字区间有两百多倍余量。
#
# 那为什么不再往大放？因为**约束不是 Edge 的字数上限，是本地档的峰值与延迟**（拆块的初衷）：
#   · 本地 matcha（板上 4×A53/2 线程实测）：20 音素 1730 ms、60 音素 4504 ms、150 音素 12211 ms
#     ⇒ 20 字≈20 音素正好落在 **1.7 s 的拐点**上（`lang/tts/sherpa/matcha/README.md` §3）；
#   · piper/VITS 系峰值 391–755 MB，在 993 MB 板上被 OOM 杀过 12 次（`lang/tts/README.md`）；
#   · Edge 每块一次往返约 1.5–2.3 s（含联网），块太碎总时长会涨，所以也给了 prefer: fill 这个旋钮。
#   ⇒ 校准式：max_chars = min(引擎单块上限 × 安全系数, 峰值/延迟预算允许的字数)
#               = min(2827 × 0.5, 20 字≈1.7 s) = **20**
# 换 TTS 引擎时按同一式子重算（ekho/http 档自带 `--max-segment-chars` 和流式分句，不吃我们的块长；
# sine 只是自检档，没有上限概念）。**别往上抬**：抬进 2800 字区间就是静默丢字。

tokenizer_profiles:
  tts_split:
    max_chars: 20          # 她 2026-11-04 定：超过 20 字就强制截断（切，不是丢）
    strict: 1              # 1＝每块原始字符数 <= max_chars，无例外（引号/长词/短末块都不外溢）
    prefer: sentence       # sentence＝句末优先（默认）| fill＝按位置取最靠后，块数更少
    hard_cut: 1            # 1＝没标点就在上限处硬断（严格模式下恒为硬断）
    min_tail: 4            # 末块短于此值：并得下就并，并不下就左右重平衡（17+4），仍守上限

  punct:                   # 原来的标点档（块长不超上限，但断点不看语义；仅作对照/回退用）
    max_chars: 40
    split_comma: 1         # 0＝只在句末符断（更长的块）

  window:                  # 固定字数硬切
    width: 40