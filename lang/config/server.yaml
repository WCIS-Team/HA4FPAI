# lang/config/server.yaml —— sserver（本服务：语音对话服务编排层）
# 端点与起法见 server/README.md；档位注册表在 server/backends/__init__.py。
# 约定：不写密钥（D-27）；环境变量优先于本文件。

server:
  bind: 0.0.0.0
  port: 18091                # HTTP 面（18090=mimo_bridge、5002=piper、2046=ekho、18080=npuserv，都避开）
  wyoming_bind: 0.0.0.0      # Wyoming 面（取代 HA4FPAI voice_gateway 的三个端口）
  wake_port: 10300
  asr_port: 10301
  tts_port: 10302
  out_rate: 48000            # 链尾「合成+SAR」的输出重采样目标（0＝保持 TTS 原生率）
  chunk_gap_ms: 80           # 多段 TTS 拼接时的段间静音
  max_concurrent: 1          # 准入闸：**本进程内**同时允许几条链（1＝串行）；不跨进程，视频不受影响
  gate_timeout_s: 30         # 排队超过这么多秒就回 429；0＝一直等

audio:
  in_sample_rate: 48000      # 板上麦克风原始率
  work_sample_rate: 16000    # 链内统一率（sar 负责降下来）
  resample_mode: decimate3-mavg3
  chunk_ms: 30

# 链路选档：换组件＝改这里（每级可选档见 server/backends/__init__.py 或 GET /components）
chain:
  sar: auto                  # auto（48k→16k 走 decimate3，其余线性）| linear | decimate3
  rms: energy                # energy（sar 之后的能量门，KWS 之前）| none；参数在 vad.yaml 的 rms_profiles
  kws: passthrough           # passthrough（留空占位，她定）| sherpa（本地 zipformer KWS）
  kws_route: default         # default（**KWS 之后的路由**，规则在 lang/kws/router.py）| none
  vad: none                  # none | sherpa（板上）| silero（raw-ORT）| webrtc | rms
  asr: remote-api            # Online by default; local sherpa models are installed but not loaded.
                             #   | echo（自检档：不识别，回固定文本，tests/smoke.py 自己钉它）
                             #   | remote-api（外部 ASR API，配置在 online.yaml 的 online.asr）
  llm: openai                # Online default; echo is for lightweight self-tests.
  router: none               # none（跳过，等价 llm）| klar（ASR 后交 klar NLP 定：llm/fixed/verify）
                             #   参数在 klar.yaml 的 router_profiles；verify 会去调下一级 spk
  spk: none                  # **声纹默认不入链**（她 2026-11-04 定）：none | sherpa
                             #   sherpa ＝ 被 router/kws_route 的 verify 点名时才装载，
                             #   跑完不常驻、闲置 spk_profiles.sherpa.idle_unload_s 秒自动卸载。
                             #   参数与门限在 vertify.yaml；模型/参数面见 lang/vertify/。
  tokenizer: tts_split        # tts_split（默认：标点优先＋严格 20 字上限）| punct（原标点档）| window
                              #   三档实现都在 lang/split/；参数在 split.yaml 的 tokenizer_profiles
  tts: edge                  # Online default; downloaded sherpa models stay unloaded.

# 共享运行时：**sherpa-onnx 是唯一 onnx 运行时**（它自带 ORT）；VAD/KWS/ASR/TTS 全在同一份里跑。
# pip 的 onnxruntime 是第二份运行时，single_runtime=true 时禁止加载（raw-ORT 的 vad:silero 用不了）。
# Default execution stays online. Installed sherpa model files are not preloaded or auto-activated.
env:
  single_runtime: true       # 只用 sherpa-onnx 那一份；要 raw-ORT 档才设 false
  allow_pip_onnxruntime: false
  intra_op_threads: 2        # 仅 pip ORT 路径用；sherpa 档的线程在各自 profile 里给

# 分词器（链路③第一环：LLM 长句切短，压 TTS 峰值 RSS）的参数**已移到 split.yaml**
# （`tokenizer_profiles.tts_split/punct/window`）——一组件一文件，与 kws/vad/tts 同款。
