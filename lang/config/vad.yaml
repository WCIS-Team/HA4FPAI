# lang/config/vad.yaml —— VAD 档（全部复用 lang/vad/ 的现成件）
# 参数口径与四档能力对照见 lang/vad/README.md（silero/ten 有 min_silence_duration；webrtc 没有，靠外层）。
vad_profiles:
  sherpa:                    # 板端现役档（sherpa_onnx.Vad，支持 min_silence_duration 秒）
    model: /mnt/data/models/vad/silero_vad_v5.onnx
    threshold: 0.5
    min_silence_duration: 0.25
    min_speech_duration: 0.25
    window_samples: 512
    num_threads: 1
  silero:                    # raw-ORT 档（本机/板上都能跑）；空 model＝取 lang/vad/models/silero_vad_v5.onnx
    model: ""
    threshold: 0.5
    min_speech_ms: 200
  webrtc:                    # 复用 lang/vad/webrtc/webrtcseg.py（.so 仅 aarch64，本机跑不了）
    mode: 2
    open_ratio: 0.6
    close_ratio: 0.3
    min_speech_ms: 200
    min_gap_ms: 300
  rms:                       # 复用 lang/vad/rms.py（纯标准库）
    open_dbfs: -35
    close_dbfs: -40
    min_speech_ms: 200
    min_gap_ms: 300

# 链路 1.5 环：sar 之后的能量门/电平（KWS 之前）。档名 energy，实现在 backends/rms.py。
# gate=true 时整段静音直接短路（不跑 KWS/VAD/ASR）；她 2026-11-04 定的顺序 sar → rms → kws。
rms_profiles:
  energy:
    frame_ms: 100
    silence_dbfs: -45        # 越小越宽松（纯静音约 -120）
    min_voiced_ms: 150       # 至少这么多毫秒超阈值才算"有内容"
    gate: true               # false＝只测不挡（只把 peak/voiced_ms 记进 out["rms"]）
    rate: 16000              # 级内按工作采样率算帧
